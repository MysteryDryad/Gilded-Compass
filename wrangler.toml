name = "gilded-compass"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The site lives at https://gilded-compass.mysterydryad.workers.dev. No preview copies (they would share the real database).
workers_dev = true
preview_urls = false

# The page is served straight from public/. Only /api/* runs the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 (not KV: KV's free tier only allows 1,000 writes a day). Create it in the Cloudflare dashboard,
# its id is below.
[[d1_databases]]
binding = "DB"
database_name = "gilded-compass"
database_id = "38424d54-39f3-4386-a762-cfed0fbc861b"

# Keep the Worker's logs (errors) in the dashboard: Worker > Observability.
[observability]
enabled = true

# Hourly housekeeping (old sign-ins, database upgrades). Bazaar checks are done by the players' userscripts.
[triggers]
crons = ["17 * * * *"]

# No secrets needed: the site never calls Torn except once at sign-in, with the player's own key.
