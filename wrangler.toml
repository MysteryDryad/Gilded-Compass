name = "gilded-compass"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The page is served straight from public/. Only /api/* runs the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 (not KV: KV's free tier only allows 1,000 writes a day). Create it in the Cloudflare dashboard,
# then put its id here.
[[d1_databases]]
binding = "DB"
database_name = "gilded-compass"
database_id = "PUT-DATABASE-ID-HERE"

# Check bazaars every minute.
[triggers]
crons = ["* * * * *"]

# One secret, set in the dashboard (Worker > Settings > Variables and Secrets), never in this file:
#   TORN_API_KEY   the site's own Torn key with Public access only, used to check bazaars and names
