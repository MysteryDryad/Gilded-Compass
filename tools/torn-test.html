<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Compass Test</title>
<style>
  :root { --bg:#0d1220; --panel:#151c2e; --gold:#d4af37; --text:#ece6d6; --muted:#9aa0b0; --bad:#e0605a; --good:#5fbf7a; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { color:var(--gold); font-weight:600; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:200px; padding:10px; border-radius:8px; border:1px solid #2a3350; background:var(--panel); color:var(--text); }
  button { padding:10px 16px; border-radius:8px; border:0; background:var(--gold); color:#1a1405; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  pre { background:var(--panel); padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:13px; }
  .good { color:var(--good); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>&#129517; Gilded Compass: browser test</h1>
  <p>Checks that your browser can talk to Torn directly. Paste your <b>Limited</b> key (Key A).
     It is sent only to api.torn.com, is never saved, and disappears when you close this tab.</p>
  <div class="row">
    <input id="key" type="password" autocomplete="off" placeholder="Torn API key (Limited)">
    <button id="go">Run test</button>
  </div>
  <pre id="out">Waiting...</pre>
</main>
<script>
const out = document.getElementById('out');
const say = (msg, cls) => { const s = document.createElement('div'); if (cls) s.className = cls; s.textContent = msg; out.appendChild(s); };

async function torn(path, key, params = {}) {
  const u = new URL('https://api.torn.com/v2' + path);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  u.searchParams.set('key', key);
  const r = await fetch(u);
  const j = await r.json();
  if (j.error) throw new Error(`Torn error ${j.error.code}: ${j.error.error}`);
  return j;
}

document.getElementById('go').onclick = async () => {
  const key = document.getElementById('key').value.trim();
  const btn = document.getElementById('go');
  if (!key) return;
  out.textContent = ''; btn.disabled = true;
  try {
    say('1. Asking Torn for the log types...');
    const lt = await torn('/torn/logtypes', key);
    const list = Array.isArray(lt.logtypes) ? lt.logtypes
               : Object.entries(lt.logtypes || {}).map(([id, title]) => ({ id, title }));
    const buys = list.filter(t => String(t.title).toLowerCase().startsWith('bazaar buy'));
    say('   Browser CAN talk to Torn directly. ✔', 'good');
    say('   Bazaar log types: ' + JSON.stringify(buys));

    say('2. Fetching your 3 newest bazaar purchases...');
    const lg = await torn('/user/log', key, { log: buys.map(b => b.id).join(','), limit: 3, sort: 'desc' });
    const entries = Array.isArray(lg.log) ? lg.log : Object.values(lg.log || {});
    say(JSON.stringify(entries, null, 2));

    say('3. Fetching the item list...');
    const it = await torn('/torn/items', key);
    const items = Array.isArray(it.items) ? it.items : Object.values(it.items || {});
    const types = [...new Set(items.map(i => i.type).filter(Boolean))].sort();
    say(`   ${items.length} items. Types: ${types.join(', ')}`);
    for (const t of ['Plushie', 'Flower']) say(`   ${t}: ${types.includes(t) ? 'OK' : 'MISSING'}`, types.includes(t) ? 'good' : 'bad');
    say('All done. Copy everything in this box (it contains no key) and paste it to Claude.', 'good');
  } catch (e) {
    if (e instanceof TypeError) say('The browser BLOCKED the call to Torn (' + e.message + '). Tell Claude: "browser blocked".', 'bad');
    else say(String(e.message || e), 'bad');
  } finally {
    btn.disabled = false;
    document.getElementById('key').value = '';
  }
};
</script>
</body>
</html>
